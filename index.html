<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnvIQ Lab Website Sample</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons for iconography -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen py-16 px-4 md:px-8 bg-gradient-to-br from-indigo-50 via-white to-slate-100">
    <div class="max-w-7xl mx-auto">
        <!-- Header Section -->
        <div class="text-center mb-20 animate-fade-in-down">
            <div class="inline-flex items-center justify-center p-4 bg-indigo-500/10 rounded-full mb-6 border border-indigo-500/20">
                <i data-lucide="flask-conical" class="h-10 w-10 text-indigo-600"></i>
            </div>
            <h1 class="text-4xl md:text-5xl lg:text-7xl font-extrabold tracking-tight text-slate-900 mb-6">
    AnvIQ Labs <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-cyan-500">Design Concepts</span>
</h1>
        </div>

        <!-- Links Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8 max-w-6xl mx-auto">
            
            <!-- Link 1: Original Concept -->
            <a href="root/index.html" target="_blank" rel="noopener noreferrer" 
               class="glass rounded-3xl p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-white hover:shadow-2xl hover:shadow-indigo-500/10 group flex flex-col items-center justify-center text-center h-48">
                <h3 class="text-2xl font-bold mb-2 text-slate-900">Sample 1</h3>
                <div class="flex items-center text-indigo-600 font-semibold group-hover:text-indigo-700 mt-2">
                    View Demo <i data-lucide="arrow-up-right" class="ml-1 w-5 h-5 transition-transform group-hover:translate-x-1 group-hover:-translate-y-1"></i>
                </div>
            </a>

            <!-- Link 2: Replit Dev -->
            <a href="https://311b7e76-49c4-4afd-b7a5-d7340696fa55-00-3at4dve6xvu9f.sisko.replit.dev/" target="_blank" rel="noopener noreferrer" 
               class="glass rounded-3xl p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-white hover:shadow-2xl hover:shadow-blue-500/10 group flex flex-col items-center justify-center text-center h-48">
                <h3 class="text-2xl font-bold mb-2 text-slate-900">Sample 2</h3>
                <div class="flex items-center text-blue-600 font-semibold group-hover:text-blue-700 mt-2">
                    View Demo <i data-lucide="arrow-up-right" class="ml-1 w-5 h-5 transition-transform group-hover:translate-x-1 group-hover:-translate-y-1"></i>
                </div>
            </a>

            <!-- Link 3: Emergent Agent -->
            <!-- <a href="https://neural-platforms.preview.emergentagent.com/" target="_blank" rel="noopener noreferrer" 
               class="glass rounded-3xl p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-white hover:shadow-2xl hover:shadow-emerald-500/10 group flex flex-col items-center justify-center text-center h-48 md:col-span-2 lg:col-span-1">
                <h3 class="text-2xl font-bold mb-2 text-slate-900">Sample 3</h3>
                <div class="flex items-center text-emerald-600 font-semibold group-hover:text-emerald-700 mt-2">
                    View Demo <i data-lucide="arrow-up-right" class="ml-1 w-5 h-5 transition-transform group-hover:translate-x-1 group-hover:-translate-y-1"></i>
                </div>
            </a> -->
            
        </div>
    </div>

    <!-- Script to render Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
